  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background-color: #181614;
      color: #edebe8;
      -webkit-tap-highlight-color: transparent;
    }
    code, pre {
      font-family: var(--font-mono);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(154, 148, 139, 0.2);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(154, 148, 139, 0.35);
    }
    .prose pre {
      background: #1e1c19 !important;
      border: 1px solid #38342e;
      border-radius: 0.85rem;
      padding: 0.85rem 1rem;
      position: relative;
      margin: 0.75rem 0;
      overflow-x: auto;
    }
    .prose code:not(pre code) {
      background: rgba(217, 119, 87, 0.12);
      color: #e5997f;
      padding: 0.12rem 0.35rem;
      border-radius: 0.35rem;
      font-size: 0.875em;
    }
    .prose p {
      margin-bottom: 0.75rem;
      line-height: 1.7;
    }
    .prose p:last-child {
      margin-bottom: 0;
    }
    .prose ul, .prose ol {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
      line-height: 1.65;
    }
    .prose ul { list-style-type: disc; }
    .prose ol { list-style-type: decimal; }
    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
    }
    .prose th, .prose td {
      border: 1px solid #38342e;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    .prose th {
      background-color: #22201d;
    }
  </style>
</head>

        </button>
        <div class="flex items-center gap-2 ml-auto">
          <button id="btnCreateNewProfile" class="px-3 py-2 bg-claude-card hover:bg-claude-border/80 text-claude-text text-xs font-medium rounded-xl transition">
            + Создать
          </button>
          <button id="btnSaveProfile" class="px-4 py-2 bg-claude-accent hover:bg-claude-accentHover text-white text-xs font-medium rounded-xl shadow-md transition">

  <!-- System Prompt Modal -->
  <div id="systemPromptModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-claude-surface border border-claude-border rounded-3xl w-full max-w-md shadow-2xl overflow-hidden animate-in fade-in duration-150">
      <div class="p-4 border-b border-claude-border/80 flex items-center justify-between">
        <h3 class="text-sm font-semibold text-claude-text">Системный промпт</h3>
        <button id="btnCloseSystemPromptModal" class="text-claude-muted hover:text-claude-text">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-4 space-y-2">
        <p class="text-xs text-claude-muted">Задайте инструкцию или роль для искусственного интеллекта:</p>
        <textarea id="systemPromptTextarea" rows="5" class="w-full bg-claude-card border border-claude-border rounded-2xl p-3 text-xs text-claude-text outline-none focus:border-claude-accent custom-scrollbar resize-none"></textarea>
      </div>
      <div class="p-3 border-t border-claude-border/80 flex justify-end gap-2">
        <button id="btnSaveSystemPrompt" class="px-4 py-2 bg-claude-accent hover:bg-claude-accentHover text-white text-xs font-medium rounded-xl transition">
          Применить
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 space-y-2 pointer-events-none w-11/12 max-w-sm"></div>

  <script>
    /* Global Application State */
    const STORAGE_KEY_PROFILES = 'nexus_claude_profiles_v2';
    const STORAGE_KEY_CHATS = 'nexus_claude_chats_v2';
    const STORAGE_KEY_CURRENT_CHAT = 'nexus_claude_current_chat_id';
    const STORAGE_KEY_ACTIVE_PROFILE = 'nexus_claude_active_profile_id';
    const STORAGE_KEY_SYSTEM_PROMPT = 'nexus_claude_system_prompt';

    // Preloaded profiles including user's Atria ASI profile
    const DEFAULT_PROFILES = [
      {
        id: 'atria-asi-default',
        name: 'Atria ASI',
        baseUrl: 'https://api.atria-asi.ai',
        chatPath: '/v1/chat/completions',
        apiKey: 'atr_pO-pjU-QlXtu3TYiMXol0-Mw7XqlCUsk',
        model: 'asi-chat',
        authHeaderTemplate: 'Bearer {KEY}'
      },
      {
        id: 'openai-standard',
        name: 'OpenAI GPT-4o',
        baseUrl: 'https://api.openai.com',
        chatPath: '/v1/chat/completions',
        apiKey: '',
        model: 'gpt-4o',
        authHeaderTemplate: 'Bearer {KEY}'
      },
      {
        id: 'groq-cloud',
        name: 'Groq Llama 3',
        baseUrl: 'https://api.groq.com/openai',
        chatPath: '/v1/chat/completions',
        apiKey: '',
        model: 'llama3-70b-8192',
        authHeaderTemplate: 'Bearer {KEY}'
      },
      {
        id: 'ollama-local',
        name: 'Ollama Local',
        baseUrl: 'http://localhost:11434',
        chatPath: '/v1/chat/completions',
        apiKey: '',
        model: 'llama3:latest',
        authHeaderTemplate: 'Bearer {KEY}'
      }
    ];

    let profiles = [];
    let chats = [];
    let currentChatId = null;
    let activeProfileId = null;
    let abortController = null;
    let currentlyEditingProfileId = null;

    /* Notification Helper */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const colors = {
        info: 'bg-claude-surface border-claude-border text-claude-text',
        success: 'bg-emerald-950/90 border-emerald-700/50 text-emerald-200',
        error: 'bg-rose-950/90 border-rose-700/50 text-rose-200',
        warning: 'bg-amber-950/90 border-amber-700/50 text-amber-200'
      };

      toast.className = `px-4 py-2.5 rounded-2xl border text-xs font-medium shadow-2xl backdrop-blur transform transition-all duration-300 translate-y-3 opacity-0 flex items-center justify-between ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-3', 'opacity-0');
        setTimeout(() => toast.remove(), 250);
      }, 3000);
    }

    function loadState() {
      try {
        const storedProfiles = localStorage.getItem(STORAGE_KEY_PROFILES);
        if (storedProfiles) {
          profiles = JSON.parse(storedProfiles);
        } else {
          profiles = [...DEFAULT_PROFILES];
          saveProfiles();
        }

        const storedChats = localStorage.getItem(STORAGE_KEY_CHATS);
        if (storedChats) {
          chats = JSON.parse(storedChats);
        } else {
          chats = [];
        }

        activeProfileId = localStorage.getItem(STORAGE_KEY_ACTIVE_PROFILE) || profiles[0]?.id;
        currentChatId = localStorage.getItem(STORAGE_KEY_CURRENT_CHAT);

        if (chats.length === 0) {
          createNewChat();
        } else if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
          currentChatId = chats[0].id;
        }

        const savedSysPrompt = localStorage.getItem(STORAGE_KEY_SYSTEM_PROMPT);
        if (savedSysPrompt) {
          document.getElementById('systemPromptTextarea').value = savedSysPrompt;
        } else {
          document.getElementById('systemPromptTextarea').value = "Ты искусственный интеллект, доброжелательный, вдумчивый и точный ассистент. Отвечай подробно, структурируй ответы с помощью Markdown и аккуратно форматируй программный код.";
        }

      } catch (err) {
        console.error("Ошибка загрузки данных:", err);
        profiles = [...DEFAULT_PROFILES];
        chats = [];
        createNewChat();
      }
    }

    function saveProfiles() {
      localStorage.setItem(STORAGE_KEY_PROFILES, JSON.stringify(profiles));
    }

    function saveChats() {
      localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chats));
    }

    function getActiveProfile() {
      return profiles.find(p => p.id === activeProfileId) || profiles[0];
    }

    function getCurrentChat() {
      return chats.find(c => c.id === currentChatId);
    }

    function renderActiveProfileUI() {
      const active = getActiveProfile();
      if (!active) return;

      document.getElementById('headerProfileLabel').textContent = active.name;
      document.getElementById('inputProfileName').textContent = active.name;

      // Populate Quick Dropdown
      const dropdownContainer = document.getElementById('quickProfileList');
      dropdownContainer.innerHTML = '';

      profiles.forEach(p => {
        const isCurrent = p.id === active.id;
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs flex items-center justify-between transition ${
          isCurrent ? 'bg-claude-accent/15 text-claude-accent font-semibold' : 'text-claude-text hover:bg-claude-card'
        }`;
        btn.innerHTML = `
          <div class="truncate mr-2">
            <div>${p.name}</div>
            <div class="text-[10px] text-claude-muted font-mono truncate">${p.model || 'default'}</div>
          </div>
          ${isCurrent ? '<svg class="w-4 h-4 text-claude-accent shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>' : ''}
        `;
        btn.onclick = () => {
          activeProfileId = p.id;
          localStorage.setItem(STORAGE_KEY_ACTIVE_PROFILE, activeProfileId);
          renderActiveProfileUI();
          document.getElementById('quickProfileDropdown').classList.add('hidden');
          showToast(`Выбрано: ${p.name}`, 'info');
        };
        dropdownContainer.appendChild(btn);
      });
    }

    function createNewChat() {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'Новый диалог',
        messages: [],
        createdAt: Date.now()
      };
      chats.unshift(newChat);
      currentChatId = newChat.id;
      localStorage.setItem(STORAGE_KEY_CURRENT_CHAT, currentChatId);
      saveChats();
      renderChatsList();
      renderMessages();
      closeSidebar();
    }

    function switchChat(chatId) {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      currentChatId = chatId;
      localStorage.setItem(STORAGE_KEY_CURRENT_CHAT, currentChatId);
      renderChatsList();
      renderMessages();
      closeSidebar();
    }

    function deleteChat(chatId, e) {
      if (e) e.stopPropagation();
      const idx = chats.findIndex(c => c.id === chatId);
      if (idx === -1) return;

      chats.splice(idx, 1);
      if (chats.length === 0) {
        createNewChat();
      } else {
        if (currentChatId === chatId) {
          currentChatId = chats[0].id;
          localStorage.setItem(STORAGE_KEY_CURRENT_CHAT, currentChatId);
        }
        saveChats();
        renderChatsList();
        renderMessages();
      }
      showToast('Диалог удален', 'info');
    }

    function renameChat(chatId, e) {
      if (e) e.stopPropagation();
      const chat = chats.find(c => c.id === chatId);
      if (!chat) return;

      const newTitle = prompt('Новое название диалога:', chat.title);
      if (newTitle && newTitle.trim()) {
        chat.title = newTitle.trim();
        saveChats();
        renderChatsList();
      }
    }

    function renderChatsList() {
      const container = document.getElementById('chatSessionsList');
      container.innerHTML = '';

      chats.forEach(chat => {
        const isActive = chat.id === currentChatId;
        const item = document.createElement('div');
        item.className = `group flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-xs transition select-none ${
          isActive 
            ? 'bg-claude-card text-claude-text font-medium border border-claude-border/80' 
            : 'text-claude-muted hover:bg-claude-card/50 hover:text-claude-text'
        }`;

        item.onclick = () => switchChat(chat.id);

        item.innerHTML = `
          <span class="truncate max-w-[170px]">${escapeHtml(chat.title)}</span>
          <div class="flex items-center gap-1 opacity-80 sm:opacity-0 group-hover:opacity-100 transition">
            <button class="btn-rename p-1 text-claude-muted hover:text-claude-text" title="Переименовать">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"/></svg>
            </button>
            <button class="btn-delete p-1 text-claude-muted hover:text-rose-400" title="Удалить">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        `;

        item.querySelector('.btn-rename').onclick = (e) => renameChat(chat.id, e);
        item.querySelector('.btn-delete').onclick = (e) => deleteChat(chat.id, e);

        container.appendChild(item);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Текст скопирован', 'success');
      } catch (err) {
        showToast('Не удалось скопировать', 'error');
      }
      document.body.removeChild(textarea);
    }

    function renderMarkdown(content) {
      if (!content) return '';
      try {
        return marked.parse(content);
      } catch (e) {
        return escapeHtml(content);
      }
    }

    function renderMessages() {
      const chat = getCurrentChat();
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';

      // Claude Empty State with terracotta starburst and warm prompt cards
      if (!chat || chat.messages.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center max-w-lg mx-auto py-8 select-none">
            <!-- Claude Starburst Glyph -->
            <div class="w-14 h-14 rounded-2xl bg-claude-accent/15 border border-claude-accent/25 flex items-center justify-center mb-5 text-claude-accent shadow-lg shadow-claude-accent/10">
              <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.5a1.2 1.2 0 0 1 1.2 1.2v3.74a7.51 7.51 0 0 1 2.8.91l2.64-2.64a1.2 1.2 0 1 1 1.7 1.7l-2.65 2.65a7.52 7.52 0 0 1 .91 2.8h3.74a1.2 1.2 0 1 1 0 2.4h-3.74a7.52 7.52 0 0 1-.91 2.8l2.65 2.65a1.2 1.2 0 1 1-1.7 1.7l-2.64-2.65a7.51 7.51 0 0 1-2.8.92v3.73a1.2 1.2 0 1 1-2.4 0v-3.74a7.51 7.51 0 0 1-2.8-.91l-2.65 2.64a1.2 1.2 0 1 1-1.7-1.7l2.65-2.64a7.52 7.52 0 0 1-.92-2.8H3.7a1.2 1.2 0 1 1 0-2.4h3.74a7.52 7.52 0 0 1 .92-2.8L5.7 7.07a1.2 1.2 0 1 1 1.7-1.7l2.64 2.65a7.51 7.51 0 0 1 2.8-.92V3.7a1.2 1.2 0 0 1 1.16-1.2Z"/>
              </svg>
            </div>
            
            <h1 class="text-xl font-medium text-claude-text mb-2">Чем могу помочь сегодня?</h1>
            <p class="text-xs text-claude-muted mb-8 max-w-sm">
              Подключен профиль <span class="text-claude-accent font-medium">${getActiveProfile()?.name}</span>. Отправьте вопрос или начните с примеров:
            </p>

            <div class="w-full space-y-2.5 text-left">
              <button class="starter-card w-full p-3.5 bg-claude-surface hover:bg-claude-card border border-claude-border rounded-2xl text-xs text-claude-text transition flex items-center justify-between">
                <span>Объясни сложную концепцию простыми словами</span>
                <svg class="w-4 h-4 text-claude-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
              </button>
              <button class="starter-card w-full p-3.5 bg-claude-surface hover:bg-claude-card border border-claude-border rounded-2xl text-xs text-claude-text transition flex items-center justify-between">
                <span>Напиши чистый и понятный код для задачи</span>
                <svg class="w-4 h-4 text-claude-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
              </button>
              <button class="starter-card w-full p-3.5 bg-claude-surface hover:bg-claude-card border border-claude-border rounded-2xl text-xs text-claude-text transition flex items-center justify-between">
                <span>Помоги отредактировать и улучшить текст</span>
                <svg class="w-4 h-4 text-claude-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
              </button>
            </div>
          </div>
        `;

        container.querySelectorAll('.starter-card').forEach(btn => {
          btn.onclick = () => {
            const text = btn.querySelector('span').textContent;
            document.getElementById('promptInput').value = text;
            sendMessage();
          };
        });
        return;
      }

      // Render active conversation
      chat.messages.forEach((msg) => {
        const isUser = msg.role === 'user';
        const msgDiv = document.createElement('div');
        msgDiv.className = `max-w-3xl mx-auto flex flex-col ${isUser ? 'items-end' : 'items-start'}`;

        if (isUser) {
          // User: Clean bubble on the right
          msgDiv.innerHTML = `
            <div class="bg-claude-card border border-claude-border text-claude-text rounded-2xl rounded-tr-md px-4 py-3 text-sm shadow-sm max-w-[85%] whitespace-pre-wrap select-text leading-relaxed">
              ${escapeHtml(msg.content)}
            </div>
          `;
        } else {
          // Claude Assistant: Seamless typography directly on background with Claude Starburst
          msgDiv.innerHTML = `
            <div class="w-full flex items-start gap-3 mt-1">
              <div class="w-6 h-6 rounded-lg bg-claude-accent/15 text-claude-accent flex items-center justify-center shrink-0 mt-0.5 shadow-sm">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2.5a1.2 1.2 0 0 1 1.2 1.2v3.74a7.51 7.51 0 0 1 2.8.91l2.64-2.64a1.2 1.2 0 1 1 1.7 1.7l-2.65 2.65a7.52 7.52 0 0 1 .91 2.8h3.74a1.2 1.2 0 1 1 0 2.4h-3.74a7.52 7.52 0 0 1-.91 2.8l2.65 2.65a1.2 1.2 0 1 1-1.7 1.7l-2.64-2.65a7.51 7.51 0 0 1-2.8.92v3.73a1.2 1.2 0 1 1-2.4 0v-3.74a7.51 7.51 0 0 1-2.8-.91l-2.65 2.64a1.2 1.2 0 1 1-1.7-1.7l2.65-2.64a7.52 7.52 0 0 1-.92-2.8H3.7a1.2 1.2 0 1 1 0-2.4h3.74a7.52 7.52 0 0 1 .92-2.8L5.7 7.07a1.2 1.2 0 1 1 1.7-1.7l2.64 2.65a7.51 7.51 0 0 1 2.8-.92V3.7a1.2 1.2 0 0 1 1.16-1.2Z"/>
                </svg>
              </div>
              
              <div class="flex-1 min-w-0">
                <div class="prose prose-invert max-w-none text-claude-text text-sm select-text leading-relaxed">
                  ${renderMarkdown(msg.content)}
                </div>

                <!-- Action Bar under Claude's Response -->
                <div class="flex items-center gap-2 mt-2 pt-1 select-none">
                  <button class="btn-copy-msg flex items-center gap-1 text-[11px] text-claude-muted hover:text-claude-text transition px-2 py-1 rounded-lg hover:bg-claude-card">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75"/></svg>
                    <span>Скопировать</span>
                  </button>
                </div>
              </div>
            </div>
          `;

          msgDiv.querySelector('.btn-copy-msg').onclick = () => copyToClipboard(msg.content);

          // Highlight codes
          msgDiv.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
          });
        }

        container.appendChild(msgDiv);
      });

      // Scroll smoothly to bottom
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const promptInput = document.getElementById('promptInput');
      const text = promptInput.value.trim();
      if (!text) return;

      const profile = getActiveProfile();
      if (!profile) {
        showToast('Выберите профиль API в настройках!', 'error');
        return;
      }

      if (!profile.baseUrl) {
        showToast('Укажите Base URL профиля!', 'error');
        return;
      }

      const chat = getCurrentChat();
      if (!chat) return;

      // Add user message
      chat.messages.push({
        role: 'user',
        content: text,
        timestamp: Date.now()
      });

      // Set chat title if first message
      if (chat.messages.length === 1) {
        chat.title = text.slice(0, 32) + (text.length > 32 ? '...' : '');
        renderChatsList();
      }

      promptInput.value = '';
      promptInput.style.height = 'auto';

      // Placeholder for assistant
      const assistantMessage = {
        role: 'assistant',
        content: '',
        timestamp: Date.now()
      };
      chat.messages.push(assistantMessage);

      renderMessages();
      saveChats();

      // UI status
      const btnSend = document.getElementById('btnSendMessage');
      const btnStop = document.getElementById('btnStopGeneration');
      btnSend.classList.add('hidden');
      btnStop.classList.remove('hidden');

      const isStream = document.getElementById('chkStream').checked;
      const systemPrompt = document.getElementById('systemPromptTextarea').value.trim();

      abortController = new AbortController();

      // Payload construction
      const messagesPayload = [];
      if (systemPrompt) {
        messagesPayload.push({ role: 'system', content: systemPrompt });
      }

      const historySlice = chat.messages.slice(0, -1).slice(-20);
      historySlice.forEach(m => {
        messagesPayload.push({
          role: m.role,
          content: m.content
        });
      });

      const requestBody = {
        model: profile.model || 'default',
        messages: messagesPayload,
        temperature: 0.7,
        stream: isStream
      };

      let fullUrl = profile.baseUrl.replace(/\/+$/, '');
      const path = (profile.chatPath || '/v1/chat/completions').replace(/^\/*/, '/');
      fullUrl += path;

      const headers = {
        'Content-Type': 'application/json',
      };

      if (profile.apiKey) {
        let authHeaderVal = (profile.authHeaderTemplate || 'Bearer {KEY}').replace('{KEY}', profile.apiKey.trim());
        headers['Authorization'] = authHeaderVal;
      }

      try {
        const response = await fetch(fullUrl, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(requestBody),
          signal: abortController.signal
        });

        if (!response.ok) {
          let errText = '';
          try {
            const errJson = await response.json();
            errText = errJson.error?.message || JSON.stringify(errJson);
          } catch (e) {
            errText = await response.text();
          }
          throw new Error(`(${response.status}): ${errText || response.statusText}`);
        }

        // Streaming handler
        if (isStream && response.body) {
          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith(':')) continue;

              if (trimmed === 'data: [DONE]') break;

              if (trimmed.startsWith('data: ')) {
                const jsonStr = trimmed.slice(6);
                try {
                  const parsed = JSON.parse(jsonStr);
                  const delta = parsed.choices?.[0]?.delta?.content || parsed.choices?.[0]?.text || '';
                  if (delta) {
                    assistantMessage.content += delta;
                    renderMessages();
                  }
                } catch (jsonErr) {}
              }
            }
          }
        } else {
          // Standard JSON
          const data = await response.json();
          const reply = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || JSON.stringify(data);
          assistantMessage.content = reply;
          renderMessages();
        }

      } catch (err) {
        if (err.name === 'AbortError') {
          assistantMessage.content += '\n\n*(Ответ прерван)*';
        } else {
          console.error("API Error:", err);
          let notice = `⚠️ **Ошибка запроса**: ${err.message}\n\n`;
          if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
            notice += `*Подсказка:* Убедитесь, что сервер **${profile.baseUrl}** доступен, а эндпоинт \`${path}\` настроен правильно.`;
          }
          assistantMessage.content = notice;
          showToast('Ошибка при запросе к API', 'error');
        }
        renderMessages();
      } finally {
        saveChats();
        btnSend.classList.remove('hidden');
        btnStop.classList.add('hidden');
        abortController = null;
      }
    }

    function openProfileModal(profileToEdit = null) {
      const modal = document.getElementById('profileModal');
      modal.classList.remove('hidden');

      const target = profileToEdit || getActiveProfile() || profiles[0];
      currentlyEditingProfileId = target ? target.id : null;

      renderProfileChips();
      populateProfileForm(target);
    }

    function renderProfileChips() {
      const container = document.getElementById('profileChipsContainer');
      container.innerHTML = '';

      profiles.forEach(p => {
        const isEditing = p.id === currentlyEditingProfileId;
        const chip = document.createElement('button');
        chip.className = `px-3 py-1.5 rounded-full text-xs font-medium border transition flex items-center gap-1.5 ${
          isEditing 
            ? 'bg-claude-accent/20 text-claude-accent border-claude-accent/60' 
            : 'bg-claude-card text-claude-muted border-claude-border hover:text-claude-text'
        }`;
        chip.innerHTML = `
          <span>${escapeHtml(p.name)}</span>
          ${p.id === activeProfileId ? '<span class="w-1.5 h-1.5 rounded-full bg-claude-accent"></span>' : ''}
        `;
        chip.onclick = () => {
          currentlyEditingProfileId = p.id;
          populateProfileForm(p);
          renderProfileChips();
        };
        container.appendChild(chip);
      });
    }

    function populateProfileForm(p) {
      if (!p) {
        document.getElementById('editProfileName').value = '';
        document.getElementById('editProfileModel').value = '';
        document.getElementById('editProfileUrl').value = '';
        document.getElementById('editProfileKey').value = '';
        document.getElementById('editProfilePath').value = '/v1/chat/completions';
        document.getElementById('editProfileAuthHeader').value = 'Bearer {KEY}';
        document.getElementById('btnDeleteProfile').classList.add('hidden');
        return;
      }

      document.getElementById('editProfileName').value = p.name || '';
      document.getElementById('editProfileModel').value = p.model || '';
      document.getElementById('editProfileUrl').value = p.baseUrl || '';
      document.getElementById('editProfileKey').value = p.apiKey || '';
      document.getElementById('editProfilePath').value = p.chatPath || '/v1/chat/completions';
      document.getElementById('editProfileAuthHeader').value = p.authHeaderTemplate || 'Bearer {KEY}';

      const btnDelete = document.getElementById('btnDeleteProfile');
      if (profiles.length > 1) {
        btnDelete.classList.remove('hidden');
      } else {
        btnDelete.classList.add('hidden');
      }

      document.getElementById('testConnectionStatus').textContent = 'Проверьте связь перед сохранением';
      document.getElementById('testConnectionStatus').className = 'text-[11px] text-claude-muted';
    }

    function saveCurrentProfile() {
      const name = document.getElementById('editProfileName').value.trim() || 'Без названия';
      const model = document.getElementById('editProfileModel').value.trim() || 'default';
      const baseUrl = document.getElementById('editProfileUrl').value.trim();
      const apiKey = document.getElementById('editProfileKey').value.trim();
      const chatPath = document.getElementById('editProfilePath').value.trim() || '/v1/chat/completions';
      const authHeaderTemplate = document.getElementById('editProfileAuthHeader').value.trim() || 'Bearer {KEY}';

      if (!baseUrl) {
        showToast('Укажите Base URL профиля!', 'warning');
        return;
      }

      if (currentlyEditingProfileId) {
        const p = profiles.find(item => item.id === currentlyEditingProfileId);
        if (p) {
          p.name = name;
          p.model = model;
          p.baseUrl = baseUrl;
          p.apiKey = apiKey;
          p.chatPath = chatPath;
          p.authHeaderTemplate = authHeaderTemplate;
          activeProfileId = p.id;
        }
      } else {
        const newProf = {
          id: 'custom_' + Date.now(),
          name,
          model,
          baseUrl,
          apiKey,
          chatPath,
          authHeaderTemplate
        };
        profiles.push(newProf);
        activeProfileId = newProf.id;
        currentlyEditingProfileId = newProf.id;
      }

      saveProfiles();
      localStorage.setItem(STORAGE_KEY_ACTIVE_PROFILE, activeProfileId);
      renderActiveProfileUI();
      document.getElementById('profileModal').classList.add('hidden');
      showToast('Профиль сохранен', 'success');
    }

    async function testProfileConnection() {
      const statusEl = document.getElementById('testConnectionStatus');
      const baseUrl = document.getElementById('editProfileUrl').value.trim();
      const path = (document.getElementById('editProfilePath').value.trim() || '/v1/chat/completions').replace(/^\/*/, '/');
      const apiKey = document.getElementById('editProfileKey').value.trim();
      const headerTpl = document.getElementById('editProfileAuthHeader').value.trim() || 'Bearer {KEY}';
      const model = document.getElementById('editProfileModel').value.trim() || 'default';

      if (!baseUrl) {
        statusEl.textContent = '❌ Введите Base URL';
        statusEl.className = 'text-[11px] text-rose-400 font-medium';
        return;
      }

      statusEl.textContent = '⏳ Проверка связи...';
      statusEl.className = 'text-[11px] text-amber-400 font-medium';

      const fullUrl = baseUrl.replace(/\/+$/, '') + path;
      const headers = { 'Content-Type': 'application/json' };
      if (apiKey) {
        headers['Authorization'] = headerTpl.replace('{KEY}', apiKey);
      }

      try {
        const testPayload = {
          model: model,
          messages: [{ role: 'user', content: 'ping' }],
          max_tokens: 5,
          stream: false
        };

        const res = await fetch(fullUrl, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(testPayload)
        });

        if (res.ok) {
          statusEl.textContent = '✅ Соединение успешно!';
          statusEl.className = 'text-[11px] text-emerald-400 font-medium';
        } else {
          statusEl.textContent = `❌ Код ответа: ${res.status}`;
          statusEl.className = 'text-[11px] text-rose-400 font-medium';
        }
      } catch (err) {
        statusEl.textContent = `❌ Ошибка сети / CORS: ${err.message}`;
        statusEl.className = 'text-[11px] text-rose-400 font-medium';
      }
    }

    function setupEventListeners() {
      // Profile Dropdown Toggle
      const btnQuick = document.getElementById('btnQuickSelectProfile');
      const btnInputPicker = document.getElementById('btnInputProfilePicker');
      const dropdown = document.getElementById('quickProfileDropdown');

      const toggleDropdown = (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('hidden');
      };

      btnQuick.onclick = toggleDropdown;
      btnInputPicker.onclick = toggleDropdown;

      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target) && !btnQuick.contains(e.target) && !btnInputPicker.contains(e.target)) {
          dropdown.classList.add('hidden');
        }
      });

      // Modals
      document.getElementById('btnOpenProfilesFromDropdown').onclick = () => {
        dropdown.classList.add('hidden');
        openProfileModal();
      };
      document.getElementById('btnOpenSettingsDrawer').onclick = () => {
        closeSidebar();
        openProfileModal();
      };
      document.getElementById('btnCloseProfileModal').onclick = () => {
        document.getElementById('profileModal').classList.add('hidden');
      };
      document.getElementById('btnSaveProfile').onclick = saveCurrentProfile;

      document.getElementById('btnCreateNewProfile').onclick = () => {
        currentlyEditingProfileId = null;
        populateProfileForm(null);
        renderProfileChips();
      };

      document.getElementById('btnDeleteProfile').onclick = () => {
        if (profiles.length <= 1) {
          showToast('Нельзя удалить единственный профиль', 'warning');
          return;
        }
        profiles = profiles.filter(p => p.id !== currentlyEditingProfileId);
        activeProfileId = profiles[0].id;
        currentlyEditingProfileId = profiles[0].id;
        saveProfiles();
        renderProfileChips();
        populateProfileForm(profiles[0]);
        renderActiveProfileUI();
        showToast('Профиль удален', 'info');
      };

      document.getElementById('btnTestConnection').onclick = testProfileConnection;

      // Toggle Key Visibility
      const btnToggleKey = document.getElementById('btnToggleKeyVisibility');
      btnToggleKey.onclick = () => {
        const input = document.getElementById('editProfileKey');
        input.type = input.type === 'password' ? 'text' : 'password';
      };

      // System Prompt Modal
      document.getElementById('btnSystemPromptDrawer').onclick = () => {
        closeSidebar();
        document.getElementById('systemPromptModal').classList.remove('hidden');
      };
      document.getElementById('btnCloseSystemPromptModal').onclick = () => {
        document.getElementById('systemPromptModal').classList.add('hidden');
      };
      document.getElementById('btnSaveSystemPrompt').onclick = () => {
        const val = document.getElementById('systemPromptTextarea').value.trim();
        localStorage.setItem(STORAGE_KEY_SYSTEM_PROMPT, val);
        document.getElementById('systemPromptModal').classList.add('hidden');
        showToast('Системный промпт сохранен', 'success');
      };

      // New Chat Buttons
      document.getElementById('btnHeaderNewChat').onclick = createNewChat;
      document.getElementById('btnDrawerNewChat').onclick = createNewChat;

      // Textarea Auto-expand & Send on Enter
      const promptInput = document.getElementById('promptInput');
      promptInput.addEventListener('input', () => {
        promptInput.style.height = 'auto';
        promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + 'px';
      });

      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      document.getElementById('btnSendMessage').onclick = sendMessage;
      document.getElementById('btnStopGeneration').onclick = () => {
        if (abortController) abortController.abort();
      };

      // Drawer Open/Close
      const btnToggleSidebar = document.getElementById('btnToggleSidebar');
      const btnCloseSidebar = document.getElementById('btnCloseSidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      btnToggleSidebar.onclick = openSidebar;
      btnCloseSidebar.onclick = closeSidebar;
      backdrop.onclick = closeSidebar;
    }

    function openSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      sidebar.classList.remove('-translate-x-full');
      backdrop.classList.remove('hidden');
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderActiveProfileUI();
      renderChatsList();
      renderMessages();
      setupEventListeners();
    });
  </script>
</body>
</html>
